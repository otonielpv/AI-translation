<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Übersetzung – German Audio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 8px; text-align: center; }
  p  { color: #94a3b8; font-size: 0.9rem; text-align: center; margin-bottom: 32px; }
  .btn-start {
    width: 200px; height: 200px;
    border-radius: 50%;
    border: none;
    background: #059669;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(5,150,105,0.4);
    transition: transform 0.1s, background 0.2s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
  }
  .btn-start:active { transform: scale(0.96); }
  .btn-start.connected  { background: #1d4ed8; box-shadow: 0 0 40px rgba(29,78,216,0.4); }
  .btn-start.connecting { background: #78350f; box-shadow: 0 0 40px rgba(120,53,15,0.4); }
  .icon { font-size: 3rem; line-height: 1; }
  .status-text { font-size: 0.85rem; margin-top: 24px; color: #64748b; text-align: center; }
  .volume-hint { margin-top: 40px; color: #475569; font-size: 0.78rem; text-align: center; }
</style>
</head>
<body>
<h1>Simultanübersetzung</h1>
<p>Drücken Sie den Knopf, um die deutsche Übersetzung zu hören.</p>

<button class="btn-start" id="btn" onclick="toggleAudio()">
  <span class="icon">🎧</span>
  <span id="btn-label">Deutsch hören</span>
</button>

<div class="status-text" id="status-text">Nicht verbunden</div>
<div class="volume-hint">Lautstärke mit dem Telefon-Lautstärkeregler einstellen</div>

<script>
  let ws = null;
  let audioCtx = null;
  let connected = false;
  let nextPlayTime = 0;
  let generation = 0;
  let decoding = false;
  const pending = [];
  const sources = new Set();
  const MAX_BUFFER_SECONDS = 8;
  const MAX_WAIT_SECONDS = 2;
  const MAX_PENDING_CHUNKS = 3;

  const btn = document.getElementById('btn');
  const btnLabel = document.getElementById('btn-label');
  const statusText = document.getElementById('status-text');

  function setStatus(label, state) {
    btnLabel.textContent = label;
    btn.className = 'btn-start ' + (state || '');
    statusText.textContent = {
      '': 'Nicht verbunden',
      'connecting': 'Verbinde…',
      'connected': 'Verbunden — Übersetzung läuft',
    }[state || ''] || '';
  }

  function clearAudio() {
    generation++;
    pending.length = 0;
    for (const src of sources) {
      try { src.stop(); } catch (_) {}
      src.disconnect();
    }
    sources.clear();
    nextPlayTime = audioCtx ? audioCtx.currentTime : 0;
  }

  async function drainAudio() {
    if (decoding) return;
    decoding = true;
    try {
      while (pending.length) {
        const {data, epoch} = pending.shift();
        try {
          const buf = await audioCtx.decodeAudioData(data);
          if (epoch !== generation || !connected) continue;
          const now = audioCtx.currentTime;
          if (nextPlayTime - now > MAX_WAIT_SECONDS ||
              Math.max(0, nextPlayTime - now) + buf.duration > MAX_BUFFER_SECONDS) {
            // Keep the current sentence; discard speech scheduled after it.
            nextPlayTime = now;
            for (const src of sources) {
              if (src.startAt > now) {
                src.stop();
                src.disconnect();
                sources.delete(src);
              } else {
                nextPlayTime = Math.max(nextPlayTime, src.endAt);
              }
            }
            statusText.textContent = 'Verzögerung aufgeholt — ältere Abschnitte übersprungen';
          }
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          src.connect(audioCtx.destination);
          // Modest catch-up when translated speech runs longer than the original.
          const rate = nextPlayTime - now > 2 ? 1.12 : 1;
          src.playbackRate.value = rate;
          src.startAt = Math.max(nextPlayTime, now + 0.03);
          src.endAt = src.startAt + buf.duration / rate;
          src.onended = () => { sources.delete(src); src.disconnect(); };
          sources.add(src);
          src.start(src.startAt);
          nextPlayTime = src.endAt;
        } catch (err) {
          console.warn('Audio chunk could not be played', err);
        }
      }
    } finally {
      decoding = false;
    }
  }

  function toggleAudio() {
    if (ws) disconnect();
    else connect();
  }

  function connect() {
    if (ws) return;
    setStatus('Verbinde…', 'connecting');
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050 });
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    clearAudio();
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const socket = new WebSocket(`${proto}://${location.host}/ws/audio`);
    ws = socket;
    socket.binaryType = 'arraybuffer';
    socket.onopen = () => {
      if (ws !== socket) return;
      connected = true;
      setStatus('Stoppen', 'connected');
    };
    socket.onmessage = (e) => {
      if (ws !== socket || !connected) return;
      if (pending.length >= MAX_PENDING_CHUNKS) {
        pending.shift();
        statusText.textContent = 'Verzögerung aufgeholt — ältere Abschnitte übersprungen';
      }
      pending.push({data: e.data, epoch: generation});
      drainAudio();
    };
    const lost = (reason) => {
      if (ws !== socket) return;
      disconnect();
      statusText.textContent = reason + ' — Erneut tippen zum Verbinden';
    };
    socket.onclose = () => lost('Verbindung unterbrochen');
    socket.onerror = () => lost('Verbindungsfehler');
  }

  function disconnect() {
    const socket = ws;
    ws = null;
    connected = false;
    if (socket) socket.close();
    clearAudio();
    if (audioCtx) audioCtx.suspend();
    setStatus('Deutsch hören', '');
  }
</script>
</body>
</html>
