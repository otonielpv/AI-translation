# AI-Translation Configuration
# Edit this file to customize the system for your setup.
# On first run a copy of this file is created if it does not exist.

server:
  host: "0.0.0.0"
  port: 8000

audio:
  # Set to the index (integer) or partial name (string) of the audio input device.
  # Leave as null to be prompted on startup.
  # Use "Behringer" to auto-detect the X32 USB interface when it is connected.
  # Use "Yeti" to select the Blue Yeti microphone.
  device: "Yeti Classic"
  sample_rate: 16000
  channels: 1
  # Buffer size in seconds for the ring buffer
  ring_buffer_seconds: 30

vad:
  pre_roll_ms: 300
  post_roll_ms: 400
  min_speech_ms: 250
  min_silence_ms: 700
  max_segment_seconds: 8
  threshold: 0.2
  # Multiply audio amplitude before VAD. Increase if mic gain is low.
  # 1.0 = no boost. Set to 1.0 once Windows mic level is at 80%+.
  input_gain: 6.0

stt:
  model_name: "medium"           # base / small / medium / large-v2 / large-v3 / large-v3-turbo
  language: "es"
  device: "auto"                 # auto / cuda / cpu
  compute_type: "int8_float16"   # float16 / int8_float16 / int8
  beam_size: 5

translation:
  backend: "helsinki"            # helsinki | argos
  # Helsinki model is downloaded automatically on first use
  helsinki_model: "Helsinki-NLP/opus-mt-es-de"

tts:
  backend: "piper"               # piper
  # Path to a Piper .onnx voice model file.
  # Download from https://huggingface.co/rhasspy/piper-voices
  # Recommended: de_DE-thorsten-medium.onnx
  piper_model: "models/piper/de_DE-thorsten-medium.onnx"
  piper_config: "models/piper/de_de_DE_thorsten_medium_de_DE-thorsten-medium.onnx.json"
  # Milliseconds of silence appended between TTS chunks
  inter_chunk_silence_ms: 200

streaming:
  # Maximum queued audio chunks per listener before old ones are dropped
  max_listener_queue: 20

midi:
  enabled: false
  # Partial name of the MIDI input port, or null to list and pick on startup
  device_name: null
  mapping:
    # Each entry: {channel: 0-15 or null, type: "note_on"|"control_change", note_or_cc: int, value: int or null}
    pause:
      type: "control_change"
      channel: null
      cc: 64
      value: null   # any value triggers
    resume:
      type: "control_change"
      channel: null
      cc: 65
      value: null
    toggle:
      type: "control_change"
      channel: null
      cc: 66
      value: null
    stop:
      type: "control_change"
      channel: null
      cc: 67
      value: null

debug:
  # Write captured speech segments to debug/seg_XXXX_es.wav
  dump_segments: true
  # Write each TTS output chunk to debug/tts_XXXX_de.wav
  dump_tts: true
  # Log all incoming MIDI events
  log_midi_events: true
  # Log level: DEBUG / INFO / WARNING / ERROR
  log_level: "INFO"
